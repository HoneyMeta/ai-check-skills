[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-check-skill"
version = "0.1.0"
description = "OpenCode/Codex skill for DOCX AI-writing-rate reports and confirmed rewrites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HoneyMeta and AI-check contributors" }]
dependencies = [
  "python-docx>=1.1.0",
  "reportlab>=4.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
